<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.4" />

  <!-- Outer shield emblem -->
  <path d="M256 70 L390 120 V250 C390 350 256 430 256 430 C256 430 122 350 122 250 V120 Z" fill="#041220" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Garuda Wings motif -->
  <path d="M256 140 L310 220 L350 220 L290 280 L310 350 L256 310 L202 350 L222 280 L162 220 L202 220 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Center INA text badge -->
  <rect x="186" y="220" width="140" height="50" rx="12" fill="#031b2e" stroke="#22d3ee" stroke-width="3" />
  <text x="256" y="254" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">INA</text>

  <!-- Bottom security dot -->
  <circle cx="256" cy="385" r="8" fill="#10b981" />
</svg>
